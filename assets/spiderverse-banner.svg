<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Bangers&amp;display=swap');
      
      /* Main bold text */
      .font-comic {
        font-family: 'Bangers', Impact, system-ui, sans-serif;
        font-size: 50px;
        text-transform: uppercase;
        font-style: italic;
        text-anchor: middle;
        dominant-baseline: central;
      }
      
      /* Slightly smaller font for the dynamic joke so it fits */
      .font-comic-small {
        font-family: 'Bangers', Impact, system-ui, sans-serif;
        font-size: 32px;
        text-transform: uppercase;
        font-style: italic;
        text-anchor: middle;
        dominant-baseline: central;
      }

      /* Dynamic Background Colors changing in sync with the 5 slides */
      @keyframes bg-colors {
        0%, 18% { fill: #0a0a16; }   /* Slide 1: Dark Space */
        20%, 38% { fill: #330a13; }  /* Slide 2: Crimson for PlainCrisp */
        40%, 58% { fill: #0a1833; }  /* Slide 3: Deep Blue */
        60%, 78% { fill: #0a2613; }  /* Slide 4: Veggie Green */
        80%, 98% { fill: #240a33; }  /* Slide 5: Funky Purple for Joke */
        100% { fill: #0a0a16; }
      }
      .dynamic-bg { animation: bg-colors 15s infinite; }

      /* Slide-in/Slide-out Video Reveal */
      @keyframes slideInOut {
        0% { transform: translateX(-800px) rotate(-3deg) skewX(-20deg) scale(1.2); opacity: 0; }
        4% { transform: translateX(20px) rotate(-2deg) skewX(10deg) scale(1.05); opacity: 1; }
        8% { transform: translateX(0px) rotate(-2deg) skewX(0deg) scale(1); opacity: 1; }
        15% { transform: translateX(0px) rotate(-2deg) skewX(0deg) scale(1); opacity: 1; }
        18% { transform: translateX(800px) rotate(-4deg) skewX(20deg) scale(1.2); opacity: 0; }
        100% { transform: translateX(800px); opacity: 0; }
      }
      .text-group {
        animation: slideInOut 15s infinite both cubic-bezier(0.25, 1, 0.5, 1);
        transform-origin: 400px 60px;
      }

      .delay-1 { animation-delay: 0s; }
      .delay-2 { animation-delay: 3s; }
      .delay-3 { animation-delay: 6s; }
      .delay-4 { animation-delay: 9s; }
      .delay-5 { animation-delay: 12s; }

      /* Glitch Aberrations */
      @keyframes glitch-cyan {
        0%, 100% { transform: translate(0, 0); }
        10% { transform: translate(-3px, 3px); }
        30% { transform: translate(-3px, -3px); }
        50% { transform: translate(-3px, 0); }
        70% { transform: translate(0, 3px); }
        90% { transform: translate(-3px, 3px); }
      }
      @keyframes glitch-red {
        0%, 100% { transform: translate(0, 0); }
        10% { transform: translate(3px, -3px); }
        30% { transform: translate(3px, 3px); }
        50% { transform: translate(3px, 0); }
        70% { transform: translate(0, -3px); }
        90% { transform: translate(3px, -3px); }
      }
      .layer-cyan { fill: #00f0ff; animation: glitch-cyan 0.2s infinite; }
      .layer-red { fill: #ff004c; animation: glitch-red 0.25s infinite; }
      .layer-white { fill: #ffffff; }
      .layer-yellow { fill: #ffea00; }

      /* Comic Burst */
      @keyframes impact-flash {
        0%, 3% { transform: scale(0); opacity: 0; }
        4% { transform: scale(2.5) rotate(5deg); opacity: 1; }
        6% { transform: scale(3.5) rotate(-5deg); opacity: 0; }
        100% { transform: scale(3.5); opacity: 0; }
      }
      .impact-flash-group { animation: impact-flash 15s infinite both; transform-origin: 400px 60px; }

      /* Spider Swing in Background */
      @keyframes spider-swing {
        0% { transform: rotate(-55deg); }
        50% { transform: rotate(55deg); }
        100% { transform: rotate(-55deg); }
      }
      .spider-dude {
        transform-origin: 400px -250px;
        animation: spider-swing 6s ease-in-out infinite;
        opacity: 0.2;
      }

      /* Thwip Text */
      @keyframes thwip-pop {
        0%, 46%, 54%, 100% { opacity: 0; transform: scale(0.5); }
        50% { opacity: 0.5; transform: scale(1.2) rotate(-15deg); }
      }
      .thwip { animation: thwip-pop 6s ease-in-out infinite; transform-origin: 550px 40px; }
      
      /* Slowly rotating halftone background */
      @keyframes spin-halftone {
        from { transform: rotate(0deg) scale(1.5); }
        to { transform: rotate(360deg) scale(1.5); }
      }
    </style>

    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#ffffff" opacity="0.07" />
    </pattern>

    <g id="impact-burst">
      <path d="M400,10 L420,35 L470,20 L445,50 L500,65 L445,80 L470,110 L420,95 L400,120 L380,95 L330,110 L355,80 L300,65 L355,50 L330,20 L380,35 Z" fill="#ff004c" opacity="0.8" />
      <path d="M400,15 L415,35 L460,25 L435,50 L480,65 L435,80 L460,105 L415,90 L400,110 L385,90 L340,105 L365,80 L320,65 L365,50 L340,25 L385,35 Z" fill="#00f0ff" opacity="0.9" />
    </g>
  </defs>

  <!-- Dynamic Colored Background -->
  <rect class="dynamic-bg" width="100%" height="100%" />

  <!-- Rotating Halftone Matrix -->
  <g style="transform-origin: 400px 60px; animation: spin-halftone 60s linear infinite;">
    <rect x="-400" y="-400" width="1600" height="1600" fill="url(#dots)" />
  </g>

  <!-- Funny Swinging Background Spider Element -->
  <g class="spider-dude">
    <line x1="400" y1="-250" x2="400" y2="30" stroke="#ffffff" stroke-width="2" />
    <!-- Spider Body -->
    <circle cx="400" cy="30" r="10" fill="#000" stroke="#ff004c" stroke-width="2" />
    <circle cx="400" cy="42" r="14" fill="#000" stroke="#ff004c" stroke-width="2" />
    <!-- Spider Legs -->
    <path d="M 390 30 Q 370 10 375 40 M 410 30 Q 430 10 425 40" fill="none" stroke="#fff" stroke-width="2"/>
    <path d="M 388 35 Q 360 30 365 55 M 412 35 Q 440 30 435 55" fill="none" stroke="#fff" stroke-width="2"/>
    <!-- Red Hourglass -->
    <path d="M 396 38 L 404 38 L 396 46 L 404 46 Z" fill="#ff004c" />
  </g>

  <!-- Thwip Comic SFX -->
  <text x="550" y="40" class="font-comic thwip layer-white" fill="#ffea00">THWIP!</text>

  <!-- === THE ANIMATED TEXT SEQUENCE === -->

  <!-- TEXT 1: AYUSH DHIMAN -->
  <g class="impact-flash-group delay-1"><use href="#impact-burst" /></g>
  <g class="text-group delay-1">
    <text x="400" y="60" class="font-comic layer-cyan">AYUSH DHIMAN</text>
    <text x="400" y="60" class="font-comic layer-red">AYUSH DHIMAN</text>
    <text x="400" y="60" class="font-comic layer-white">AYUSH DHIMAN</text>
  </g>

  <!-- TEXT 2: BUILDING PLAINCRISP.COM -->
  <g class="impact-flash-group delay-2"><use href="#impact-burst" /></g>
  <g class="text-group delay-2">
    <text x="400" y="60" class="font-comic layer-cyan">BUILDING PLAINCRISP.COM</text>
    <text x="400" y="60" class="font-comic layer-red">BUILDING PLAINCRISP.COM</text>
    <text x="400" y="60" class="font-comic layer-yellow">BUILDING PLAINCRISP.COM</text>
  </g>

  <!-- TEXT 3: CRACKED DEV -->
  <g class="impact-flash-group delay-3"><use href="#impact-burst" /></g>
  <g class="text-group delay-3">
    <text x="400" y="60" class="font-comic layer-cyan">CRACKED DEV</text>
    <text x="400" y="60" class="font-comic layer-red">CRACKED DEV</text>
    <text x="400" y="60" class="font-comic layer-white">CRACKED DEV</text>
  </g>

  <!-- TEXT 4: I TOUCH GRASS...SOMETIMES -->
  <g class="impact-flash-group delay-4"><use href="#impact-burst" /></g>
  <g class="text-group delay-4">
    <text x="400" y="60" class="font-comic layer-cyan">I TOUCH GRASS...SOMETIMES</text>
    <text x="400" y="60" class="font-comic layer-red">I TOUCH GRASS...SOMETIMES</text>
    <text x="400" y="60" class="font-comic layer-yellow">I TOUCH GRASS...SOMETIMES</text>
  </g>

  <!-- TEXT 5: DYNAMIC GITHUB ACTION JOKE -->
  <g class="impact-flash-group delay-5"><use href="#impact-burst" /></g>
  <g class="text-group delay-5">
    <text x="400" y="44" class="font-comic-small layer-cyan">// THIS LINE DOESN'T ACTUALLY DO ANYTHING,</text>
<text x="400" y="76" class="font-comic-small layer-cyan">BUT THE CODE STOPS WORKING WHEN I DELETE IT.</text>

    <text x="400" y="44" class="font-comic-small layer-red">// THIS LINE DOESN'T ACTUALLY DO ANYTHING,</text>
<text x="400" y="76" class="font-comic-small layer-red">BUT THE CODE STOPS WORKING WHEN I DELETE IT.</text>

    <text x="400" y="44" class="font-comic-small layer-white">// THIS LINE DOESN'T ACTUALLY DO ANYTHING,</text>
<text x="400" y="76" class="font-comic-small layer-white">BUT THE CODE STOPS WORKING WHEN I DELETE IT.</text>

  </g>

  <!-- Cinematic Frame Overflow Shadows -->
  <rect x="0" y="0" width="100%" height="10%" fill="black" opacity="0.3" />
  <rect x="0" y="90%" width="100%" height="10%" fill="black" opacity="0.3" />
</svg>
